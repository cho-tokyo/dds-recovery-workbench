[package]
name = "dds-case-manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
chrono.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
dds-core.workspace = true
dds-wish-match.workspace = true
# Chunk 23: 業務オーケストレーション (`execute_business_recovery`) のため。
# 単方向依存維持: case-manager → recovery / report / fs-ntfs（逆向きはなし）。
dds-recovery.workspace = true
dds-report.workspace = true
dds-fs-ntfs.workspace = true
# Chunk 24d-4-2: 営業向け診断書 DOCX 生成のため。
docx-rs.workspace = true

[dev-dependencies]
tempfile.workspace = true
zstd = "0.13"
# Chunk 24b: perf_demo_chunk24b_recovery_speed でワーカー数表示に使用。
num_cpus.workspace = true
# Chunk 24d-4-2: 業務診断書 DOCX のテストで XML を抽出して内容検証するため。
zip = { version = "0.6", default-features = false, features = ["deflate"] }
